<style>

.opt input{margin-right:9px}.nav{display:flex;justify-content:space-between;gap:10px;margin-top:14px}.nav button{border:0;border-radius:10px;padding:12px 18px;font-size:15px;background:#2a303b;color:#fff;cursor:pointer}.nav .primary{background:var(--accent);color:#08111f;font-weight:700}.nav button:disabled{opacity:.4;cursor:not-allowed}

const qs=[["Which level of AI is designed mainly for a specific task?",["General AI","Narrow AI","Strong AI","Super AI"],1],["Who proposed the Turing Test in 1950?",["Alan Turing","Marvin Minsky","John McCarthy","Arthur Samuel"],0],["Which event formalized AI as a field in 1956?",["The Dartmouth meeting","The invention of the GPU","The first expert system","The AI Winter"],0],["John McCarthy defined AI as the science and engineering of making:",["Databases","Intelligent machines","Neural networks","Robots only"],1],["Which period is associated with the expert-systems industry bust?",["1950–56","1969–79","1988–93","2000–10"],2],["A major limitation of the Turing Test is that:",["Behavioral imitation does not prove true understanding","It only works for chess","It requires GPUs","It cannot test language"],0],["A major weakness of Symbolic AI is difficulty with:",["Logical rules","Knowledge representation","Basic arithmetic","Ambiguity and unstructured environments"],3],["Which AI approach uses symbols, rules, and explicit knowledge?",["Machine Learning","Clustering","Reinforcement Learning","Symbolic AI"],3],["In Machine Learning, intelligence primarily emerges from:",["Manual coding","Fixed expert rules","Patterns learned from data","Random actions"],2],["Which hardware unit is especially useful for parallel AI computation?",["RAM","SSD","Keyboard","GPU"],3],["Which specialized Google processor was developed for machine-learning workloads?",["CPU","NIC","TPU","HDD"],2],["A major cost advantage of Cloud AI is that users generally:",["Avoid all computing","Get unlimited free hardware","Pay only for resources they use","Never need data"],2],["Which feature of Cloud AI helps make AI tools accessible without owning large local infrastructure?",["Ambiguity","Accessibility","Static behavior","Constraint solving"],1],["A smart thermostat learning household preferences is an example of AI in:",["Transportation","The home","Banking","Manufacturing"],1],["AI can optimize traffic by:",["Removing navigation","Making roads static","Deleting vehicles","Predicting traffic and adjusting routes"],3],["AI identifying positive or negative customer feedback is:",["Clustering","Regression","Scheduling","Sentiment Analysis"],3],["Agentic AI is characterized by:",["Only fixed if-then rules","No decision making","Autonomy, planning, goals, and adaptation","Only reacting to immediate stimuli"],2],["Machines may struggle despite strong performance because they can lack:",["Sensors","Contextual understanding and handling of ambiguity","Processors","Electricity"],1],["AI-based detection of manufacturing defects is an example of:",["Gaming","Recommendation","Translation","Quality Assurance"],3],["AI used to build predictive models and analyze patterns for researchers is:",["Smart Home AI","Scientific Modeling","Customer Service AI","Scheduling"],1],["Which component perceives information from the environment?",["Goals","Actuators","Utility","Sensors"],3],["Which component executes an action selected by an agent?",["Sensors","Domains","Percepts","Actuators"],3],["A crossword puzzle is generally a:",["Dynamic environment","Static environment","Random environment","Partially observable environment"],1],["An environment that changes while an agent is deciding is:",["Fully observable","Closed","Static","Dynamic"],3],["An agent that maps a percept directly to an action is a:",["Simple Reflex Agent","Goal-Based Agent","Model-Based Reflex Agent","Utility-Based Agent"],0],["A threshold-based thermostat is a classic example of a:",["Goal-Based Agent","Learning Agent","Simple Reflex Agent","Utility-Based Agent"],2],["An agent that evaluates future outcomes against a desired objective is a:",["Goal-Based Agent","Random Agent","Simple Reflex Agent","Sensor Agent"],0],["An agent that compares desirability of outcomes uses:",["Only sensors","Only heuristics","Utility","No internal state"],2],["A key drawback of Utility-Based Agents is:",["They cannot choose actions","They cannot model outcomes","Computational cost can be high","They have no preferences"],2],["Which agent maintains an internal model of the world?",["Model-Based Reflex Agent","Simple Reflex Agent","Static Agent","Sensor Agent"],0],["Model-Based Reflex Agents handle partial observability by:",["Using only utility","Using an internal model and prior state information","Removing sensors","Ignoring history"],1],["The internal function of an AI agent mainly determines:",["How information is processed into decisions","The physical size of the robot","The screen resolution","How electricity is supplied"],0],["Chess is generally an example of a:",["Partially observable environment","Fully observable environment","Random environment","Unobservable environment"],1],["A strength of Model-Based Reflex Agents is:",["They can handle dynamic and partially observable situations","They ignore previous information","They only work in static settings","They need no memory"],0],["Which behavior best represents Agentic AI?",["Planning multiple steps toward an objective","Immediate reflex only","Ignoring goals","Following one fixed command forever"],0],["The systematic exploration of possibilities to find a solution is:",["Sentiment Analysis","Search","Regression","Deployment"],1],["A heuristic is best described as:",["A probability distribution","A rule of thumb guiding search","A hardware unit","A guaranteed optimal solution"],1],["Straight-line distance to a destination can serve as a:",["Heuristic","Reward","Label","Constraint"],0],["Heuristics are useful because they can provide:",["Fast, reasonable decisions","No computation","Guaranteed perfection","Zero uncertainty"],0],["In the 8-puzzle, a heuristic can estimate:",["The CPU temperature","The dataset size","How close tiles are to goal positions","The number of players"],2],["Strategic thinking in games involves:",["Predicting consequences and selecting strong moves","Choosing randomly","Avoiding all planning","Ignoring opponents"],0],["A CSP is defined by:",["Variables, domains, and constraints","States, actions, and utilities","Sensors, actuators, and rewards","Data, model, and deployment"],0],["Map coloring is a classic example of:",["Classification","Reinforcement Learning","Constraint Satisfaction","Regression"],2],["Utility measures:",["Sensor speed","How much data exists","How many CPUs exist","How desirable an outcome is"],3],["A utility-driven agent typically selects:",["The first action","The highest-utility option","A random action","The lowest-probability option"],1],["Prioritizing critical patients in an emergency department is an example of:",["Gaming AI","Entertainment AI","Map coloring","Healthcare AI"],3],["Which is an example of a desirable state for an agent?",["A percept","A sensor","A variable","More money and less time"],3],["Search is used primarily to:",["Define hardware","Explore possible solutions systematically","Prevent every error","Collect only images"],1],["Scheduling university exams without conflicts is a:",["Sentiment Analysis task","Constraint Satisfaction Problem","Regression task","Clustering task"],1],["Problem solving is fundamental to intelligence because AI systems often must:",["Avoid all data","Use only reflex rules","Make decisions and find solutions to objectives","Eliminate goals"],2],["A system that imitates human expert decisions with predefined rules is an:",["Expert System","Clustering Engine","Unsupervised Model","Actuator"],0],["For fast approximate navigation decisions, which approach can be especially useful?",["Random guessing","Heuristics","CSP only","Database normalization"],1],["Uncertainty in AI means:",["Complete knowledge","Lack of complete certainty about outcomes","High processor speed","A static environment"],1],["A camera working in fog may introduce uncertainty through:",["Sensor errors","Constraints","Utility","Cloud pricing"],0],["The word 'bank' having two meanings is an example of:",["Sensor error","Ambiguity","Static behavior","Overfitting"],1],["Probability measures:",["Likelihood of an event","Computational cost","Desirability of an outcome","Number of actions"],0],["A spam filter is more likely to classify an email as spam when:",["The probability is exactly 50%","The probability of spam is high","The sender is unknown regardless of evidence","No evidence exists"],1],["A probability distribution shows:",["How likely different outcomes are","The utility of every action","The number of processors","Only the dataset size"],0],["Using probability to infer the most likely explanation from evidence is:",["Dimensionality Reduction","Deployment","Classification","Probabilistic Inference"],3],["Bayesian inference is useful because it can:",["Update beliefs when new evidence appears","Remove all uncertainty","Guarantee 100% accuracy","Ignore evidence"],0],["Which set contains methods that can help handle uncertainty?",["Only CSPs","Only GPUs and RAM","Only actuators and sensors","Fuzzy logic, neural networks, and rule-based systems"],3],["A traffic app can use probability to:",["Guarantee zero traffic","Suggest alternative routes when heavy traffic is likely","Remove uncertainty completely","Make every route identical"],1],["Which statement best contrasts heuristics and probability?",["Probability guarantees correctness","Heuristics use rules of thumb; probability uses statistical likelihood","Heuristics never use experience","They are identical"],1],["A new trend unseen in past recommendation data illustrates:",["Perfect information","Sensor error","Static behavior","Changing environments"],3],["If an autonomous car estimates a 95% chance an object is a pedestrian, that probability can:",["Determine the CPU brand","Strongly influence a cautious action","Replace all sensors","Guarantee the object is a pedestrian"],1],["Mitchell's definition of learning involves performance improving through:",["Static rules","More actuators","Experience","Random guessing"],2],["Why does an AI agent learn?",[ x viewing history is an example of:",["Financial data","Transportation data","Healthcare data","Entertainment data"],3],["A larger representative dataset can help because it:",["Eliminates testing","Captures more variation in the problem","Guarantees perfect predictions","Removes all computing costs"],1],["Which statement correctly compares Symbolic AI and ML?",["Symbolic AI uses rules/symbols; ML learns patterns from data","Symbolic AI cannot represent knowledge","Both require the same approach","ML does not require data"],0],["Supervised Learning uses:",["Only unlabeled data","Only rules","Only rewards","Labeled examples"],3],["The two major supervised learning techniques are:",["Rewards and penalties","Search and CSP","Classification and Regression","Clustering and PCA"],2],["Predicting spam vs not spam is:",["Classification","Clustering","Dimensionality Reduction","Regression"],0],["Predicting a house price is:",["Regression","Classification","Clustering","Search"],0],["Assessing whether a loan applicant is likely to repay is:",["Dimensionality Reduction","Credit Scoring / Classification","Clustering","Reinforcement Learning"],1],["Estimating an insurance or healthcare cost is commonly:",["Regression","Classification","Clustering","CSP"],0],["The main goal of Unsupervised Learning is to:",["Maximize a reward signal","Discover patterns in unlabeled data","Follow fixed rules","Learn only from labels"],1],["Grouping similar customers without labels is:",["Regression","Clustering","Classification","Search"],1],["Dimensionality reduction is especially useful when:",["There are too many features","There is no data","A model is already deployed","All variables are identical"],0],["Finding communities in a social network can use:",["Regression","Credit scoring","Clustering","Temperature prediction"],2],["Reinforcement Learning learns using:",["Only clustering","Only labeled examples","Trial and error with rewards","Only predefined rules"],2],["In self-driving RL, a collision would normally produce:",["A positive reward","A negative reward","No feedback","A classification label"],1],["The action space of a self-driving car includes:",["Only rewards","Acceleration, braking, steering, lane changes","Only the road map","Only its position"],1],["Which pair contains unsupervised learning algorithms?",["Linear Regression and Naive Bayes","Classification and Regression","SVM and Credit Scoring","PCA and K-means"],3],["A common application of Reinforcement Learning is:",["Spam storage","Map coloring only","Robotics and autonomous vehicles","Medical record formatting"],2],["AI is a multidisciplinary field, and the concept is yet to be precisely defined.",["True","False"],0],["The “AI Winter” followed the boom of the Expert Systems industry between 1980–88.",["True","False"],0],["The Turing Test, if passed by a machine, guarantees that the machine possesses true human-like understanding and consciousness.",["True","False"],1],["Symbolic AI is flexible and easily handles ambiguity and unstructured data.",["False","True"],0],["Mycin, an AI system for infectious diseases, is an example of Symbolic AI.",["False","True"],1],["Machine Learning models lack transparency, often acting as a “black box,” making them difficult to interpret.",["False","True"],1],["TPUs are faster and more energy-efficient for general-purpose computing compared to GPUs.",["False","True"],0],["Cloud AI is only accessible to users with expensive local hardware and advanced expertise.",["True","False"],1],["In an AI agent system, Percepts are the execution of actions based on decisions.",["False","True"],0],["A Static Environment is one where the problem remains unchanged, like a crossword puzzle.",["False","True"],1],["The environment in a game of Chess is considered Partially Observable.",["False","True"],0],["Simple Reflex Agents have memory or the capability to learn from past states.",["False","True"],0],["A Simple Reflex Agent operates on a condition-action rule (if-then statements).",["False","True"],1],["Goal-Based Agents must have a clear definition of goals, and planning can be computationally expensive.",["True","False"],0],["Utility-Based Agents prioritize outcomes that maximize utility over simply achieving a predefined goal.",["False","True"],1],["Model-Based Reflex Agents require a state representation of the environment.",["False","True"],1],["Agentic AI is an advanced form of AI that is autonomous and makes human-like judgment calls.",["True","False"],0],["Search in AI works by randomly exploring different possibilities until a goal is reached.",["False","True"],0],["Heuristics are rules of thumb that guarantee finding the optimal solution for complex problems.",["True","False"],1],["In Competitive Games, AI strategizes only by focusing on its own optimal moves, ignoring the opponent’s potential actions.",["False","True"],0],["Timetabling (assigning courses to classrooms without overlaps) is a real-life example of a Constraint Satisfaction Problem (CSP).",["False","True"],1],["Utility functions map outcomes (states of the world) to real numbers that describe an agent’s preferences.",["False","True"],1],["Incomplete Data is a source of uncertainty where the same input can mean different things (e.g., “bank”).",["False","True"],0],["AI systems facing uncertainty provide absolute, non-probabilistic answers.",["True","False"],1],["Bayesian Inference is a key tool that allows AI to update its predictions dynamically as new evidence is received.",["False","True"],1],["According to the ML definition, a program’s performance on task T should decrease with experience E.",["False","True"],0],["The quality and quantity of the collected data determine the efficiency of the ML model’s output.",["True","False"],0],["Unstructured Data is information organized in a predefined manner, such as rows and columns.",["True","False"],1],["E-commerce Data includes product listings, prices, customer reviews, and streaming history.",["True","False"],1],["In Supervised Learning, the training datasets must be labeled.",["True","False"],0],["Classification is used in applications like Fraud Detection.",["True","False"],0],["Regression is used to predict a discrete category, such as whether a patient has cancer.",["True","False"],1],["One challenge of Supervised Learning is that datasets can have a high likelihood of human error, resulting in algorithms learning incorrectly.",["False","True"],1],["Unsupervised Learning aims to discover patterns in datasets that are fully labeled.",["False","True"],0],["Clustering is used in Market Basket Analysis to discover patterns in customer purchasing habits.",["True","False"],0],["Dimensionality Reduction is an Unsupervised Learning technique used to increase the number of features in a dataset.",["True","False"],1],["In Reinforcement Learning for self-driving cars, the Environment consists solely of the car’s sensors and internal map.",["False","True"],0],["In the ML Pipeline, the Validation Set is optional and is used for final, unbiased evaluation.",["False","True"],0],["When evaluating a Regression model, a higher R-squared means the model’s predictions closely follow real trends.",["False","True"],1],["Model Deployment is the step where the model’s internal parameters are minimized to reduce errors.",["True","False"],1],["Microsoft Azure is a Cloud Computing platform that provides services for running AI-powered solutions without needing on-premises infrastructure.",["True","False"],0],["Automated Machine Learning (AutoML) in Azure AI lets Azure select and train the best AI model for a given problem.",["False","True"],1],["Azure AI services are only available to users with advanced coding skills.",["True","False"],1],["The Content Safety Studio in Azure AI helps users explore how text and image content can be moderated.",["True","False"],0],["In the Content Safety Service, there are four severity levels for harmful content, ranging from safe to high.",["True","False"],0],["One of the goals of using Azure for AI is its high scalability, allowing AI solutions to handle small to large datasets effortlessly.",["False","True"],1],["Voice-Controlled Devices like Alexa and Google Home use AI to automate tasks via voice commands.",["True","False"],0],["Scientific Modeling and Data Visualization are applications of AI used to simplify complex datasets.",["False","True"],1],["Heuristic methods are effective for real-time applications because they prioritize making fast, reasonable choices.",["False","True"],1],["AI decision-making under uncertainty means the AI completely avoids making a choice until all data is certain.",["False","True"],0],["Who defined AI as “the science and engineering of making intelligent machines”?",["John McCarthy","Elaine Rich","Alan Turing","Patrick Henry"],0],["Which of the following is NOT an application of AI in daily life?",["Smart thermostats","Recommendation systems","Emotional intelligence in humans","Self-driving cars"],2],["Which of the following is an example of Expert Systems?",["Google Translate","Tesla Autopilot","DENDRAL","Spotify recommendations"],2],["Which of the following best describes Machine Learning?",["Replacing GPUs","Learning patterns from data","Using explicit rules only","Eliminating symbolic reasoning"],1],["What does Artificial Intelligence (AI) aim to achieve?",["Eliminating all human decision-making","Making machines perform tasks that require human intelligence","Programming only simple tasks","Building faster hardware only"],1],["Cloud AI provides which of the following benefits?",["Accessibility","Cost-effectiveness","All of the above","Scalability"],2],["The Turing Test was proposed in:",["1943","1965","1950","1980"],2],["Which AI approach uses symbols and rules to simulate human reasoning?",["Machine Learning","Symbolic AI","Neural Networks","Cloud AI"],1],["Which decade is known for the “AI Winter” when expert systems declined?",["2000s","1980s–1990s","1970s","1950s"],1],["Which level of AI is also called “Weak AI”?",["Cognitive AI","Super AI","Narrow AI","General AI"],2],["What is the purpose of image recognition?",["To classify images into predefined classes or categories","To compress videos","To delete unwanted images","To increase internet speed"],0],["What types of data does Computer Vision mainly analyze?",["Database tables","Audio and speech","Text and numbers only","Images and videos"],3],["What is the main purpose of Pose Estimation?",["To improve image brightness","To remove image backgrounds","To determine the position and orientation of objects or people","To classify images as RGB or grayscale"],2],["What is object tracking?",["Identifying only one image","Following the movement of an object across video frames","Removing an object from an image","Changing the image resolution"],1],["What is the main difference between Computer Vision and Image Processing?",["Computer Vision interprets visual data, while Image Processing manipulates images","Computer Vision only changes image colors","They are exactly the same","Image Processing makes decisions about objects"],0],["In Computer Vision, what is typically used to capture visual information?",["Printer","Camera or sensor array","Keyboard","Speaker"],1],["In human vision, what captures the scene?",["Camera","Scanner","Sensor array","Eyes"],3],["What is Computer Vision?",["A database management system","A programming language","A branch of networking","A branch of artificial intelligence that enables machines to understand visual information"],3],["What does the term “scene” refer to in Computer Vision?",["A video file only","A database","A computer program","The environment or object being observed"],3],["What does object detection provide in addition to identifying objects?",["The object’s precise location using bounding boxes","The object’s file size","The object’s internet address","The object’s creation date"],0],["Which NLP-based tool helps correct grammar and plagiarism?",["AutoCAD?","Photoshop?","Grammarly?","Premiere Pro"],2],["Which NLP application is most relevant for detecting misinformation online?",["Machine translation?","Spam filtering?","Fake-news detection?","Speech-to-text"],2],["What is the first step when processing text in NLP?",["Raw text collection?","Preprocessing?","Model training","Tokenization?"],0],["What does Natural Language Processing (NLP) primarily aim to do?",["Translate code into binary","Enable computers to understand and generate human language","Teach humans programming languages","Improve computer hardware performance"],1],["Search engines like Google use NLP mainly to:",["Render 3-D graphics?","Manage databases","Understand user queries and return relevant results?","Compile source code?"],2],["Virtual assistants such as Siri and Alexa mainly use NLP for:",["Understanding user queries and responding appropriately?","Encrypting data?","Filtering spam"],0],["Which of the following is not a natural language?",["Python?","French","English?","Arabic?"],0],["Foundation Models differ because they:",["Operate without deep learning","Do not require data?","Are trained for a single task?","Are trained on diverse data and can be adapted for many tasks?"],3],["Which of these is not part of the NLP pipeline?",["Model training","Tokenization?","Preprocessing?","Image recognition?"],3],["Traditional NLP models are usually limited because they:",["Are purely unsupervised?","Use small datasets and rule-based methods?","Do not use text input","Depend only on images?"],1]];let cur=0;const ans=Array(qs.length).fill(null);const checked=Array(qs.length).fill(false);
function topic(){return cur<100?'MTA MCQ':cur<150?'MTA True / False':cur<160?'Chapter 1':cur<170?'Computer Vision':'NLP'}

function setupJump(){
  const sel=document.getElementById('jumpSelect');
  if(sel.options.length===qs.length) return;
  sel.innerHTML='';
  qs.forEach((_,i)=>{
    const o=document.createElement('option');
    o.value=i;
    o.textContent='Question '+(i+1);
    sel.appendChild(o);
  });
}
function jumpToQuestion(v){
  cur=Number(v);
  render();
  window.scrollTo(0,0);
}
function render(){
 const [q,opts]=qs[cur];
 let html=`<div class="num">Q${cur+1}</div><div class="section">${topic()}</div><div class="question">${q}</div>`;
 html+=opts.map((o,i)=>`<label class="opt"><input type="radio" name="ans" value="${i}" ${ans[cur]===i?'checked':''} ${checked[cur]?'disabled':''}>${String.fromCharCode(65+i)}) ${o}</label>`).join('');
 if(checked[cur]){
   const ok=ans[cur]===qs[cur][2];
   html+=ok
    ? `<div class="feedback ok">✅ Correct!</div>`
    : `<div class="feedback bad">❌ Wrong. Correct answer: ${String.fromCharCode(65+qs[cur][2])}) ${qs[cur][1][qs[cur][2]]}</div>`;
 }
 document.getElementById('card').innerHTML=html;
 document.querySelectorAll('input[name=ans]').forEach(x=>x.onchange=()=>{ans[cur]=+x.value;checked[cur]=true;render();});
 document.getElementById('bar').style.width=((cur+1)/qs.length*100)+'%';
 document.getElementById('jumpSelect').value=String(cur);
 document.getElementById('prev').disabled=cur===0;
 document.getElementById('next').style.display=cur===qs.length-1?'none':'block';
 document.getElementById('submit').style.display=cur===qs.length-1?'block':'none';
}
function go(d){cur=Math.max(0,Math.min(qs.length-1,cur+d));render();scrollTo({top:0,behavior:'smooth'});}
function submitExam(){
 const unanswered=ans.filter(x=>x===null).length;
 if(unanswered&&!confirm(`You have ${unanswered} unanswered question(s). Submit anyway?`))return;
 let s=0;qs.forEach((x,i)=>{if(ans[i]===x[2])s++});
 let p=Math.round(s/qs.length*100);let grade=p>=90?'Excellent':p>=80?'Very good':p>=70?'Good':p>=60?'Needs review':'Needs significant review';
 let r='';qs.forEach((x,i)=>{let ok=ans[i]===x[2];r+=`<div class="ri ${ok?'yes':'no'}"><b>Question</b> ${ok?'✓':'✗'}<br>Your answer: ${ans[i]===null?'Not answered':String.fromCharCode(65+ans[i])+') '+x[1][ans[i]]}<br>Correct: ${String.fromCharCode(65+x[2])+') '+x[1][x[2]]}</div>`});
 document.getElementById('result').style.display='block';
 document.getElementById('result').innerHTML=`<div class="score">${s}/180</div><div class="grade">${p}% — ${grade}</div><div class="review">${r}</div>`;
 document.getElementById('result').scrollIntoView({behavior:'smooth'});
}
setupJump();
render();</script></body></html>
